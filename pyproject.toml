# for-agents is a collection of Claude Code plugins, not a Python package.
# This file exists so `uv` can pin the docs toolchain (mkdocs-material) in uv.lock.
[project]
name = "for-agents"
version = "0.0.0"
description = "Claude Code plugins for AI-assisted development"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.0",
]

[tool.uv]
package = false
