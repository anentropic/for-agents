name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deslop:
    name: deslop docs scanner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run the deslop tests
        run: python3 -m unittest discover -s tests/deslop -v
